[build-system]
requires = [
    "setuptools>=75",
]
build-backend = "setuptools.build_meta"

[project]
name = "swedesweets"
version = "0.1.0"
description = "SwedeSweets operational platform"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "Django>=6.0,<6.1",
    "Pillow>=10.0",
    "django-extensions>=4.1,<5.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
    "whitenoise>=6.9,<7.0",
    "ipython>=9.0,<10.0",
    "pytest>=9.0,<10.0",
    "pytest-django>=4.12,<5.0",
    "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]
testpaths = [
    "config",
    "products",
    "inventory",
    "accounts",
    "reservations",
    "customers",
    "ops_portal",
    "business_portal",
    "orders",
    "pricing",
    "business",
    "retail",
    "fulfillment",
    "payments",
    "storefront",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/admin.py",
    "*/apps.py",
    "*/urls.py",
    "*/views.py",
    "*/forms.py",
    "*/demo.py",
    "manage.py",
    "config/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = [
    "accounts*",
    "business*",
    "business_portal*",
    "common*",
    "config*",
    "customers*",
    "fulfillment*",
    "inventory*",
    "ops_portal*",
    "orders*",
    "payments*",
    "products*",
    "reservations*",
    "retail*",
    "storefront*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # simplify
]
ignore = []
