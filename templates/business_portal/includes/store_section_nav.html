{% load i18n %}

<nav
  class="section-nav"
  aria-label="{% trans 'Store sections' %}"
>
  <a
    class="section-nav__link{% if active_section == 'overview' %} section-nav__link--active{% endif %}"
    href="{% url 'business_portal:profile' %}"
    {% if active_section == "overview" %}aria-current="page"{% endif %}
  >
    {% trans "Overview" %}
  </a>

  <a
    class="section-nav__link{% if active_section == 'orders' %} section-nav__link--active{% endif %}"
    href="{% url 'business_portal:orders' %}"
    {% if active_section == "orders" %}aria-current="page"{% endif %}
  >
    {% trans "Orders" %}
  </a>
</nav>
