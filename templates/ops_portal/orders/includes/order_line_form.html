{# templates/ops_portal/orders/includes/order_line_form.html #}
{% load i18n %}

<article
  class="portal-cart-line"
  data-order-line
  data-product-id="{{ line_form.initial.product|default_if_none:'' }}"
>
  {{ line_form.product }}
  {{ line_form.unit }}

  <div class="portal-cart-line__product">
    <span
      class="portal-cart-line__product-label"
      data-order-line-product-label
    >
      {{ line_form.initial.product_label }}
    </span>
  </div>

  <div class="portal-cart-line__quantity">
    <div class="quantity-stepper" data-quantity-stepper>
      <button
        class="quantity-stepper__button quantity-stepper__button--decrease"
        type="button"
        aria-label="{% trans 'Decrease quantity' %}"
        data-quantity-decrease
      >
        <span aria-hidden="true">−</span>
      </button>

      <label
        class="visually-hidden"
        for="{{ line_form.quantity.id_for_label }}"
      >
        {% trans "Quantity" %}
      </label>

      {{ line_form.quantity }}

      <button
        class="quantity-stepper__button quantity-stepper__button--increase"
        type="button"
        aria-label="{% trans 'Increase quantity' %}"
        data-quantity-increase
      >
        <span aria-hidden="true">+</span>
      </button>
    </div>
  </div>

  <div class="portal-cart-line__action">
    <button
      class="portal-cart-line__remove-button"
      type="button"
      aria-label="{% trans 'Remove product' %}"
      data-remove-order-line
    >
      {% include "includes/ui/icon_block.html" with name="trash" size="sm" only %}
    </button>
  </div>
</article>
